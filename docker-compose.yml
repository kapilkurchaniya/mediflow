# Local Postgres for development and tests:  docker compose up -d db
# Creates two databases: `mediflow` (the app) and `mediflow_test` (the test suite).
# If Docker's bridge networking is unavailable on your machine, see docs/08-local-setup.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: mediflow
      POSTGRES_DB: mediflow
    ports:
      - "5432:5432"
    volumes:
      - mediflow-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mediflow-pgdata:
