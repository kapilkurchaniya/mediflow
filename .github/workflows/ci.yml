name: CI

on:
  pull_request:
  push:
    branches: ["main", "master", "lane-a/**", "lane-b/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build never connects to the database; env.ts only needs a syntactically valid URL.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # TODO(Phase 0 · A0.6): remove continue-on-error once the existing 70 lint errors are fixed.
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
