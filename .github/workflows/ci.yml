name: CI/CD Pipeline

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master", "lane-a/**", "lane-b/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  deployments: write

jobs:
  verify:
    name: Verify (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mediflow
          POSTGRES_HOST_AUTH_METHOD: trust # throw-away database that lives only for this job
          POSTGRES_DB: mediflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mediflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The build never connects to the database; env.ts only needs a syntactically valid URL.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (blocking - 0 errors allowed)
        run: npm run lint:strict

      - name: Tests (unit + integration)
        run: npm test
        env:
          # Real Postgres service above; the suite builds a migrated template DB and copies it per test file.
          DATABASE_URL: postgres://mediflow@localhost:5432/mediflow_test

      - name: Build Verification
        run: npm run build

  e2e:
    name: Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mediflow
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mediflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mediflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mediflow@localhost:5432/mediflow_test
      ALLOW_E2E_DB_RESET: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
      APP_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      CRON_SECRET: "ci-test-cron-secret"
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed Test Database
        run: npx tsx scripts/seed-e2e.ts

      - name: Build Application for E2E
        run: npm run build

      - name: Run Playwright E2E Tests
        run: npx playwright test
        env:
          SKIP_BUILD: "1"
          PORT: "3000"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Auto Deploy to Production (Vercel)
    needs: [verify, e2e]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Production Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL is set, running database migrations..."
            npm run db:migrate
          else
            echo "DATABASE_URL is not set; skipping database migrations."
          fi

      - name: Check Vercel Token Secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing in GitHub Repository Secrets! Please add VERCEL_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Production)
        id: deploy-vercel
        run: |
          DEPLOY_URL=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_0vjeaamZrsAW1ORAKUnCKYX2' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_od3DI3D0plUMQ78Wgzot5mteLaJn' }}

      - name: Post-Deploy Health Check Smoke Test
        if: steps.deploy-vercel.outputs.url != ''
        run: |
          DEPLOY_URL="${{ steps.deploy-vercel.outputs.url }}"
          echo "Checking health of $DEPLOY_URL..."
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/api/health" || echo "000")
          echo "Health endpoint returned HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 307 ] && [ "$HTTP_STATUS" -ne 308 ]; then
            echo "::warning::Health check returned status $HTTP_STATUS"
          else
            echo "✅ Health check passed with HTTP $HTTP_STATUS"
          fi
