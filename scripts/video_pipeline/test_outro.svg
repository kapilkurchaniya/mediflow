<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1700" cy="200" r="300" fill="#10b981" opacity="0.12"/>
  <circle cx="200" cy="800" r="400" fill="#059669" opacity="0.15"/>

  <g transform="translate(960, 540)" text-anchor="middle" font-family="Liberation Sans, sans-serif">
    <!-- Takeaway Pill -->
    <rect x="-160" y="-240" width="320" height="44" rx="22" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="-211" fill="#34d399" font-size="16" font-weight="bold" letter-spacing="2">
      KEY REGULATORY RULE
    </text>

    <!-- Takeaway Text: cleanly wrapped or appropriately sized -->
    <text x="0" y="-120" fill="#ffffff" font-size="40" font-weight="bold">
      Parked bills lock zero inventory and allocate no invoice numbers.
    </text>

    <!-- Next Part Banner: 1100px wide so 49 chars fit with huge margins -->
    <g transform="translate(0, 40)">
      <rect x="-550" y="-50" width="1100" height="130" rx="24" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="2.5"/>
      <text x="0" y="-8" fill="#34d399" font-size="18" font-weight="bold" letter-spacing="3">
        TO BE CONTINUED IN PART 8
      </text>
      <text x="0" y="46" fill="#f8fafc" font-size="30" font-weight="bold">
        Recalling Parked Bills &amp; Live Stock Revalidation (F7)
      </text>
    </g>

    <!-- Footer -->
    <text x="0" y="240" fill="#64748b" font-size="18" font-weight="bold" letter-spacing="2">
      MEDIFLOW · NEXT GENERATION INDIAN PHARMACY ERP
    </text>
  </g>
</svg>