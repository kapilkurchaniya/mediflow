<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="300" fill="#0284c7" opacity="0.12"/>
  <circle cx="1700" cy="800" r="400" fill="#0369a1" opacity="0.15"/>

  <g transform="translate(960, 540)" text-anchor="middle" font-family="Liberation Sans, sans-serif">
    <!-- Top Pill: generous width 560px for ~400px text -->
    <rect x="-280" y="-230" width="560" height="48" rx="24" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-199" fill="#38bdf8" font-size="18" font-weight="bold" letter-spacing="2">
      POS COUNTER MASTERY · PART 7 OF 14
    </text>

    <!-- Main Title -->
    <text x="0" y="-80" fill="#ffffff" font-size="56" font-weight="bold">
      Parking Active Bills with F6
    </text>

    <!-- Subtitle -->
    <text x="0" y="-10" fill="#94a3b8" font-size="24">
      Unblock the counter when a patient steps away to fetch cash
    </text>

    <!-- Shortcut Pill -->
    <g transform="translate(0, 90)">
      <rect x="-160" y="-32" width="320" height="64" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="0" y="11" fill="#38bdf8" font-size="28" font-weight="bold" font-family="Liberation Mono, monospace">
        F6 · HOLD BILL
      </text>
    </g>

    <text x="0" y="240" fill="#64748b" font-size="18" font-weight="bold" letter-spacing="2">
      MEDIFLOW QUICK TUTORIAL GUIDES
    </text>
  </g>
</svg>