[package]
name = "mediflow-desktop"
version = "0.1.0"
description = "MediFlow Native Desktop POS Application"
authors = ["MediFlow Team"]
edition = "2021"

[lib]
name = "mediflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }
